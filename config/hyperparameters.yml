LunarLander-x:
  fc1_nodes: 8
  number_of_layer: 1
  algo:
    activation_function: relu     #Louis (27/04/2026 - 10h32): switch case de batard pas tant que ça en vrai
    optimizer: adam                #Louis (27/04/2026 - 10h32): switch case de batard pas tant que ça en vrai
  env:
    wind:
      enable_wind: false
      wind_power: 0
      turbulence_power: 0
    gravity:
      gravity: -10.0
    fuel:
      enable_fuel: false
    continuous:
      enable_continuous: false
  hypers:
    memory:
      replay_memory_size: 100000
      mini_batch_size: 64
    epsilon:
      epsilon_init: 0.9
      epsilon_min: 0.01
      epsilon_decay: 0.9999
    stop_on_mean_reward: 300
    learning_rate_a: 0.001

